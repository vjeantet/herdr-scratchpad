# Manifeste de herdr-scratchpad — un presse-papier éditable persistant.
#
# Note de conception : le dock EN BAS à 30 % n'est PAS exprimable ici. Le
# manifeste n'accepte que `placement = overlay|popup|split|tab|zoomed`, sans
# `direction` ni `ratio`, et un split déclaratif est câblé en 50/50 vers la
# droite (herdr, src/app/api/plugins/panes.rs -> tab.rs:361). L'entrée
# [[panes]] ci-dessous n'est donc qu'un REPLI utilisable ; le vrai placement
# vient du script lanceur, qui appelle `pane split --direction down --ratio`.

id = "herdr-scratchpad"
name = "herdr-scratchpad"
version = "0.2.0"
description = "Persistent editable clipboard docked at the bottom: one plain-text buffer per tab, copied with a single key, or dropped into an agent's input box."
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

# Étape lancée par `herdr plugin install` après le clone : le manifeste vise
# target/release/herdr-scratchpad, qu'un checkout frais ne possède pas. herdr
# exécute la commande avec la racine du manifeste pour cwd, d'où le chemin
# relatif. Le script télécharge le binaire précompilé publié pour cette version
# et cette plateforme et vérifie son SHA-256, en retombant sur
# `cargo build --release` au moindre manque — un toolchain Rust n'est donc
# requis que lorsqu'aucune release ne correspond (cf. scripts/fetch-or-build.sh).
[[build]]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

# Repli déclaratif : ouvre le pane sans le placement voulu, quand le script
# n'est pas disponible ou que le binaire n'est pas encore construit.
[[panes]]
id = "scratchpad"
title = "Scratchpad"
description = "The scratchpad pane, without the launcher placement."
placement = "split"
command = ["./target/release/herdr-scratchpad"]

[[actions]]
id = "open-scratchpad"
title = "Toggle scratchpad"
description = "Opens the scratchpad docked at the bottom (focuses it if open, closes it if focused)."
command = ["bash", "scripts/open-scratchpad.sh"]
